name: Five-policy constellation scalability seed 42

on:
  workflow_dispatch:
  push:
    branches: [new_BLAtest]
    paths:
      - .github/workflows/scalability-seed42.yml

permissions:
  contents: write

jobs:
  verify-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: new_BLAtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: satellite_mec/requirements-new-bla.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r satellite_mec/requirements-new-bla.txt

      - name: Verify checkpoint and scalability implementation
        working-directory: satellite_mec
        run: |
          (cd checkpoints/LyaMAPPO_lh4_32K && md5sum -c CHECKSUMS.md5)
          python -m unittest tests.test_scalability_evaluation tests.test_dod_energy_attribution tests.test_new_bla_mappo_math

      - name: Run short smoke experiment
        working-directory: satellite_mec
        run: >-
          python run_scalability_evaluation.py
          --seed 42 --planes 16 --sats-per-plane 8 12
          --warmup-slots 2 --eval-slots 3
          --output-dir results/scalability_smoke
          --snapshot-dir results/scalability_smoke/snapshots

  evaluate-size:
    needs: verify-and-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - sats_per_plane: 8
            n_sats: 128
          - sats_per_plane: 10
            n_sats: 160
          - sats_per_plane: 12
            n_sats: 192
          - sats_per_plane: 16
            n_sats: 256
          - sats_per_plane: 20
            n_sats: 320
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: new_BLAtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: satellite_mec/requirements-new-bla.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r satellite_mec/requirements-new-bla.txt

      - name: Run full experiment for this size
        working-directory: satellite_mec
        run: >-
          python run_scalability_evaluation.py
          --seed 42 --planes 16 --sats-per-plane ${{ matrix.sats_per_plane }}
          --warmup-slots 5400 --eval-slots 5400
          --output-dir results/scalability_n${{ matrix.n_sats }}_seed42
          --snapshot-dir checkpoints/warmup_states

      - name: Verify per-size outputs
        shell: bash
        run: |
          out=satellite_mec/results/scalability_n${{ matrix.n_sats }}_seed42
          test -s "$out/scalability_summary.csv"
          test -s "$out/scalability_slot_metrics.csv"
          test -s "$out/run_manifest.json"
          test "$(($(wc -l < "$out/scalability_summary.csv") - 1))" -eq 5
          test "$(($(wc -l < "$out/scalability_slot_metrics.csv") - 1))" -eq 27000
          test -s "$out/figures/fig_1_user_satisfaction.png"
          test -s "$out/figures/fig_2_system_delay.png"
          test -s "$out/figures/fig_3_system_energy.png"
          test -s "$out/figures/fig_4_total_lifetime_loss.png"
          cat "$out/scalability_summary.csv"
          cat "$out/run_manifest.json"

      - name: Commit verified 192-satellite warm-up state to GitHub
        if: matrix.n_sats == 192
        shell: bash
        run: |
          snapshot=satellite_mec/checkpoints/warmup_states/bla_mappo_n192_seed42_w5400.pkl.gz
          test -s "$snapshot"
          test -s "$snapshot.json"
          test "$(stat -c%s "$snapshot")" -lt 95000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add satellite_mec/checkpoints/warmup_states/bla_mappo_n192_seed42_w5400.pkl.gz
          git add satellite_mec/checkpoints/warmup_states/bla_mappo_n192_seed42_w5400.pkl.gz.json
          git diff --cached --quiet || git commit -m "data: save verified 192-satellite warm-up state"
          git push origin HEAD:new_BLAtest

      - name: Upload per-size results
        uses: actions/upload-artifact@v4
        with:
          name: scalability-n${{ matrix.n_sats }}-seed42-${{ github.sha }}
          path: satellite_mec/results/scalability_n${{ matrix.n_sats }}_seed42
          if-no-files-found: error
          retention-days: 90

  aggregate-and-plot:
    needs: evaluate-size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: new_BLAtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy matplotlib

      - name: Download per-size results
        uses: actions/download-artifact@v4
        with:
          pattern: scalability-n*-seed42-${{ github.sha }}
          path: downloaded-scalability

      - name: Merge CSV files and draw four joint curves
        working-directory: satellite_mec
        run: >-
          python aggregate_scalability_results.py
          --input-root ../downloaded-scalability
          --output-dir results/scalability_seed42
          --expected-n 128 160 192 256 320

      - name: Verify combined deliverable
        shell: bash
        run: |
          out=satellite_mec/results/scalability_seed42
          test "$(($(wc -l < "$out/scalability_summary.csv") - 1))" -eq 25
          test "$(($(wc -l < "$out/scalability_slot_metrics.csv") - 1))" -eq 135000
          test -s "$out/figures/fig_1_user_satisfaction.png"
          test -s "$out/figures/fig_2_system_delay.png"
          test -s "$out/figures/fig_3_system_energy.png"
          test -s "$out/figures/fig_4_total_lifetime_loss.png"
          cat "$out/scalability_summary.csv"

      - name: Upload combined CSV, manifest, and four figures
        uses: actions/upload-artifact@v4
        with:
          name: scalability-seed42-combined-${{ github.sha }}
          path: satellite_mec/results/scalability_seed42
          if-no-files-found: error
          retention-days: 90
