name: MARL real-env smoke

on:
  push:
    branches:
      - experiment/marl-backbone-smoke
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch
      - name: Run real SatelliteMECEnv smoke test
        working-directory: satellite_mec
        env:
          SMOKE_TRAIN_SLOTS: '32'
          SMOKE_EVAL_SLOTS: '8'
        run: python backbone/real_env_smoke.py
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marl-real-env-smoke-results
          path: satellite_mec/results/backbone_compare/real_env_smoke/
          if-no-files-found: warn
