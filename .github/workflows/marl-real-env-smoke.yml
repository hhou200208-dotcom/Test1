name: MARL real-env smoke

on:
  push:
    branches:
      - experiment/marl-backbone-smoke
    paths:
      - .github/workflows/marl-real-env-smoke.yml
      - satellite_mec/backbone/compare_algorithms.py
      - satellite_mec/backbone/real_env_smoke.py
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run real SatelliteMECEnv smoke test
        working-directory: satellite_mec
        env:
          PYTHONPATH: ${{ github.workspace }}/satellite_mec
          SMOKE_TRAIN_SLOTS: '64'
          SMOKE_EVAL_SLOTS: '16'
        run: python backbone/real_env_smoke.py
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marl-real-env-smoke-results
          path: satellite_mec/results/backbone_compare/real_env_smoke/
          if-no-files-found: warn
