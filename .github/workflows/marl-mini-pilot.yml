name: MARL mini pilot

on:
  push:
    branches:
      - experiment/marl-backbone-smoke
    paths:
      - .github/workflows/marl-mini-pilot.yml
      - satellite_mec/backbone/pilot_compare.py
  workflow_dispatch:

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        algorithm: [MAPPO, IPPO, MADDPG, QMIX]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run one-seed mini pilot
        working-directory: satellite_mec
        env:
          PYTHONPATH: ${{ github.workspace }}/satellite_mec
          ALGORITHM: ${{ matrix.algorithm }}
          PILOT_SEED: '0'
          PILOT_TRAIN_SLOTS: '1024'
          PILOT_EVAL_INTERVAL: '256'
          PILOT_EVAL_SLOTS: '64'
        run: python backbone/pilot_compare.py
      - name: Upload pilot data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marl-mini-pilot-${{ matrix.algorithm }}
          path: satellite_mec/results/backbone_compare/mini_pilot/${{ matrix.algorithm }}/seed0/
          if-no-files-found: warn
