name: new BLA-MAPPO 32K demo1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: satellite_mec/requirements-new-bla.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r satellite_mec/requirements-new-bla.txt

      - name: Verify BLA-MAPPO equations
        working-directory: satellite_mec
        run: python -m unittest tests.test_new_bla_mappo_math

      - name: Run 5x5 BLA-MAPPO 32K training
        working-directory: satellite_mec
        run: >-
          python train_new_bla_mappo.py
          --small_scale
          --t_train 32000
          --t_eval 5400
          --n_runs 1
          --model_name new_BLA-MAPPOdemo1

      - name: Print recorded metrics
        id: results
        shell: bash
        run: |
          run_dir=$(find satellite_mec/results -mindepth 1 -maxdepth 1 -type d -name '*_new_BLA_MAPPO' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          test -n "$run_dir"
          test -d "$run_dir/new_BLA-MAPPOdemo1"
          test -f "$run_dir/training_reward_curve.png"
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "BLA-MAPPO 32K demo1 metrics:"
          cat "$run_dir/new_bla_eval.json"

      - name: Upload experiment, final model, and reward plot
        uses: actions/upload-artifact@v4
        with:
          name: new-BLA-MAPPOdemo1-${{ github.sha }}
          path: ${{ steps.results.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 90
