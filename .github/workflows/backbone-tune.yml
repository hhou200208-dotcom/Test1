name: Backbone mini tuning

on:
  push:
    branches: [experiment/marl-backbone-smoke]
    paths:
      - .github/workflows/backbone-tune.yml
      - satellite_mec/backbone/backbone_tune.py
  workflow_dispatch:

jobs:
  tune:
    strategy:
      fail-fast: false
      matrix:
        include:
          - algo: MAPPO
            tag: a_default
            actor_lr: '1e-4'
            critic_lr: '1e-3'
            qmix_lr: '5e-4'
          - algo: MAPPO
            tag: b_actor3e-4
            actor_lr: '3e-4'
            critic_lr: '1e-3'
            qmix_lr: '5e-4'
          - algo: MAPPO
            tag: c_critic3e-4
            actor_lr: '1e-4'
            critic_lr: '3e-4'
            qmix_lr: '5e-4'
          - algo: IPPO
            tag: a_default
            actor_lr: '1e-4'
            critic_lr: '1e-3'
            qmix_lr: '5e-4'
          - algo: IPPO
            tag: b_actor3e-4
            actor_lr: '3e-4'
            critic_lr: '1e-3'
            qmix_lr: '5e-4'
          - algo: IPPO
            tag: c_critic3e-4
            actor_lr: '1e-4'
            critic_lr: '3e-4'
            qmix_lr: '5e-4'
          - algo: QMIX
            tag: a_lr1e-4
            actor_lr: '1e-4'
            critic_lr: '1e-3'
            qmix_lr: '1e-4'
          - algo: QMIX
            tag: b_lr5e-4
            actor_lr: '1e-4'
            critic_lr: '1e-3'
            qmix_lr: '5e-4'
          - algo: QMIX
            tag: c_lr1e-3
            actor_lr: '1e-4'
            critic_lr: '1e-3'
            qmix_lr: '1e-3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tuning candidate
        working-directory: satellite_mec
        env:
          PYTHONPATH: ${{ github.workspace }}/satellite_mec
          TUNE_ALGO: ${{ matrix.algo }}
          TUNE_TAG: ${{ matrix.tag }}
          ACTOR_LR: ${{ matrix.actor_lr }}
          CRITIC_LR: ${{ matrix.critic_lr }}
          QMIX_LR: ${{ matrix.qmix_lr }}
        run: python backbone/backbone_tune.py
      - name: Upload tuning data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backbone-tune-${{ matrix.algo }}-${{ matrix.tag }}
          path: satellite_mec/results/backbone_compare/tuning/${{ matrix.algo }}/${{ matrix.tag }}/
          if-no-files-found: warn
